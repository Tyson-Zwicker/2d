<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Line Angle Finder</title>
  <style>
    :root {
      --bg: #0f111a;
      --panel: #161a2a;
      --ink: #f2f4ff;
      --accent: #ffb000;
      --accent-2: #37d399;
      --muted: #9aa3c7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(800px 400px at 10% 10%, #2a2f55 0%, #0f111a 70%);
      color: var(--ink);
      font-family: "Space Grotesk", "Segoe UI", sans-serif;
    }

    .wrap {
      width: min(980px, 95vw);
      display: grid;
      gap: 20px;
      grid-template-columns: 1fr 320px;
    }

    .panel {
      background: var(--panel);
      border-radius: 16px;
      padding: 18px 20px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
    }

    canvas {
      width: 100%;
      height: 520px;
      border-radius: 16px;
      background: linear-gradient(140deg, #111425, #141a35);
      cursor: crosshair;
      display: block;
    }

    h1 {
      font-size: 1.4rem;
      margin: 0 0 8px;
      letter-spacing: 0.03em;
    }

    p {
      margin: 8px 0;
      color: var(--muted);
      line-height: 1.4;
    }

    .stat {
      font-size: 2.3rem;
      color: var(--accent);
      margin: 14px 0;
    }

    button {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      color: #101218;
      background: var(--accent);
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px) scale(1.01);
      filter: brightness(1.05);
    }

    .legend {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      color: var(--muted);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      display: inline-block;
      background: var(--accent-2);
    }

    .dot.line2 {
      background: #ff5c8a;
    }

    @media (max-width: 900px) {
      .wrap {
        grid-template-columns: 1fr;
      }

      canvas {
        height: 420px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <canvas id="stage" width="920" height="520"></canvas>
    </div>
    <div class="panel">
      <h1>Draw Two Lines</h1>
      <p>Click two points for line 1, then two points for line 2.</p>
      <div class="stat" id="angleValue">--</div>
      <p id="angleNote">Angle between the projected lines.</p>
      <button id="resetBtn">Reset</button>
      <div class="legend">
        <div class="chip"><span class="dot"></span>Line 1</div>
        <div class="chip"><span class="dot line2"></span>Line 2</div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");
    const angleValue = document.getElementById("angleValue");
    const angleNote = document.getElementById("angleNote");
    const resetBtn = document.getElementById("resetBtn");

    const points = [];

    const colors = {
      line1: "#37d399",
      line2: "#ff5c8a",
      point: "#f2f4ff",
    };

    const toCanvasPoint = (event) => {
      const rect = canvas.getBoundingClientRect();
      return {
        x: ((event.clientX - rect.left) / rect.width) * canvas.width,
        y: ((event.clientY - rect.top) / rect.height) * canvas.height,
      };
    };

    const draw = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (points.length >= 2) {
        drawLine(points[0], points[1], colors.line1);
      }
      if (points.length >= 4) {
        drawLine(points[2], points[3], colors.line2);
      }

      points.forEach((point, index) => {
        const color = index < 2 ? colors.line1 : colors.line2;
        drawPoint(point, color);
      });
    };

    const drawLine = (start, end, stroke) => {
      ctx.strokeStyle = stroke;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(start.x, start.y);
      ctx.lineTo(end.x, end.y);
      ctx.stroke();
    };

    const drawPoint = (point, fill) => {
      ctx.fillStyle = fill;
      ctx.beginPath();
      ctx.arc(point.x, point.y, 5, 0, Math.PI * 2);
      ctx.fill();
    };

    const lineIntersection = (a1, a2, b1, b2) => {
      const dx1 = a2.x - a1.x;
      const dy1 = a2.y - a1.y;
      const dx2 = b2.x - b1.x;
      const dy2 = b2.y - b1.y;

      const denom = dx1 * dy2 - dy1 * dx2;
      if (Math.abs(denom) < 1e-9) {
        const cross = (b1.x - a1.x) * dy1 - (b1.y - a1.y) * dx1;
        return Math.abs(cross) < 1e-9 ? { type: "colinear" } : null;
      }

      const ua = ((b1.x - a1.x) * dy2 - (b1.y - a1.y) * dx2) / denom;
      return {
        type: "point",
        x: a1.x + ua * dx1,
        y: a1.y + ua * dy1,
      };
    };

    const angleBetween = (a1, a2, b1, b2) => {
      const v1 = { x: a2.x - a1.x, y: a2.y - a1.y };
      const v2 = { x: b2.x - b1.x, y: b2.y - b1.y };
      const mag1 = Math.hypot(v1.x, v1.y);
      const mag2 = Math.hypot(v2.x, v2.y);

      if (mag1 < 1e-9 || mag2 < 1e-9) {
        return null;
      }

      const dot = v1.x * v2.x + v1.y * v2.y;
      const cos = Math.min(1, Math.max(-1, dot / (mag1 * mag2)));
      const radians = Math.acos(cos);
      return (radians * 180) / Math.PI;
    };

    const updateAngle = () => {
      if (points.length < 4) {
        angleValue.textContent = "--";
        angleNote.textContent = "Angle between the projected lines.";
        return;
      }

      const intersection = lineIntersection(points[0], points[1], points[2], points[3]);
      if (!intersection) {
        angleValue.textContent = "null";
        angleNote.textContent = "Lines are parallel and never intersect.";
        return;
      }

      const angle = angleBetween(points[0], points[1], points[2], points[3]);
      if (angle === null) {
        angleValue.textContent = "null";
        angleNote.textContent = "A line segment has zero length.";
        return;
      }

      angleValue.textContent = `${angle.toFixed(2)}°`;
      angleNote.textContent = intersection.type === "colinear"
        ? "Colinear lines: angle is 0° by definition."
        : "Intersection found on projected lines.";

      if (intersection.type === "point") {
        ctx.fillStyle = "#ffd166";
        ctx.beginPath();
        ctx.arc(intersection.x, intersection.y, 6, 0, Math.PI * 2);
        ctx.fill();
      }
    };

    const reset = () => {
      points.length = 0;
      draw();
      updateAngle();
    };

    canvas.addEventListener("click", (event) => {
      if (points.length >= 4) {
        return;
      }
      points.push(toCanvasPoint(event));
      draw();
      updateAngle();
    });

    resetBtn.addEventListener("click", reset);

    draw();
  </script>
</body>
</html>
