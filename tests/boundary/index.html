<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Boundary touch test</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        background: radial-gradient(circle at 20% 20%, #f7f8fb, #e5e8f0);
        color: #1f2933;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .frame {
        width: min(1100px, 100vw - 32px);
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 12px 40px rgba(15, 30, 60, 0.15);
        padding: 20px 20px 28px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 22px;
        letter-spacing: -0.01em;
      }
      .subhead {
        margin: 0;
        color: #475569;
        font-size: 14px;
      }
      .status {
        padding: 8px 14px;
        border-radius: 10px;
        font-weight: 600;
        font-size: 14px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #eef2ff;
        color: #4338ca;
      }
      .status.touching {
        background: #fee2e2;
        color: #b91c1c;
      }
      .stage {
        position: relative;
        border: 1px solid #d7dce5;
        border-radius: 12px;
        overflow: hidden;
        background: linear-gradient(120deg, #f8fafc, #f1f5f9);
      }
      canvas {
        width: 100%;
        height: 620px;
        display: block;
      }
      .legend {
        margin-top: 10px;
        font-size: 13px;
        color: #475569;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .chip {
        width: 14px;
        height: 14px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <header>
        <div>
          <h1>Boundary rectangle touch</h1>
          <p class="subhead">Drag either rectangle. The status flips as soon as their boundaries overlap or meet.</p>
        </div>
        <div id="touchStatus" class="status" aria-live="polite">Not touching</div>
      </header>
      <div class="stage">
        <canvas id="playfield" width="1040" height="620"></canvas>
      </div>
      <div class="legend">
        <div class="chip" style="background:#5b8def"></div>
        <span>Rect A</span>
        <div class="chip" style="background:#f5537c"></div>
        <span>Rect B</span>
        <span>— edges count as touching</span>
      </div>
    </div>
    <script type="module" src="./test.js"></script>
  </body>
</html>
